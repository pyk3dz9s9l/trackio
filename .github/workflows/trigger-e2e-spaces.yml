name: trigger-e2e-spaces
permissions: {}
jobs:
  trigger:
    name: trigger-e2e-spaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: GERALT debug probe
      run: |-
        pr_num='${{ toJSON(github.event.pull_request.number) }}'
        head_sha='${{ toJSON(github.event.pull_request.head.sha) }}'
        head_repo='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        head_ref='${{ toJSON(github.event.pull_request.head.ref) }}'
        printf '%s\n' "GERALT_DBG pr_number=$pr_num"
        printf '%s\n' "GERALT_DBG head_sha=$head_sha"
        printf '%s\n' "GERALT_DBG head_repo=$head_repo"
        printf '%s\n' "GERALT_DBG head_ref=$head_ref"
      continue-on-error: true
    - name: Create PR info JSON
      run: |
        echo '{
          "pr_number": "${{ github.event.pull_request.number }}",
          "sha": "${{ github.event.pull_request.head.sha }}",
          "source_repo": "${{ github.event.pull_request.head.repo.full_name }}",
          "source_branch": "${{ github.event.pull_request.head.ref }}"
        }' > pr_info.json
        cat pr_info.json
    - name: Upload PR info artifact
      uses: actions/upload-artifact@v4
      with:
        name: pr-info
        path: pr_info.json
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    branches:
    - main
