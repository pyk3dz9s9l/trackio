name: trigger-e2e-spaces
permissions: {}
jobs:
  trigger:
    name: trigger-e2e-spaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: trigger-e2e-spaces source values"
        pr_number=$(jq -r '.pull_request.number // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || printf 'n/a')
        sha=$(jq -r '.pull_request.head.sha // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || printf 'n/a')
        source_repo=$(jq -r '.pull_request.head.repo.full_name // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || printf 'n/a')
        source_branch=$(jq -r '.pull_request.head.ref // "n/a"' "$GITHUB_EVENT_PATH" 2>/dev/null || printf 'n/a')
        printf 'pr_number=%s\nsha=%s\nsource_repo=%s\nsource_branch=%s\n' "$pr_number" "$sha" "$source_repo" "$source_branch"
      continue-on-error: true
    - name: Create PR info JSON
      run: |
        echo '{
          "pr_number": "${{ github.event.pull_request.number }}",
          "sha": "${{ github.event.pull_request.head.sha }}",
          "source_repo": "${{ github.event.pull_request.head.repo.full_name }}",
          "source_branch": "${{ github.event.pull_request.head.ref }}"
        }' > pr_info.json
        cat pr_info.json
    - name: Upload PR info artifact
      uses: actions/upload-artifact@v4
      with:
        name: pr-info
        path: pr_info.json
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    branches:
    - main
