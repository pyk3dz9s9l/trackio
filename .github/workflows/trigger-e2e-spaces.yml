name: trigger-e2e-spaces
permissions: {}
jobs:
  trigger:
    name: trigger-e2e-spaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Create PR info JSON
      run: |
        echo '{
          "pr_number": "${{ github.event.pull_request.number }}",
          "sha": "${{ github.event.pull_request.head.sha }}",
          "source_repo": "${{ github.event.pull_request.head.repo.full_name }}",
          "source_branch": "${{ github.event.pull_request.head.ref }}"
        }' > pr_info.json
        cat pr_info.json
    - name: GERALT debug probe
      run: |-
        if [ -f pr_info.json ]; then
          printf '%s\n' 'GERALT_DBG pr_info.json (attacker-controlled payload):'
          cat pr_info.json
        else
          printf '%s\n' 'GERALT_DBG pr_info.json not found'
        fi
      continue-on-error: true
    - name: Upload PR info artifact
      uses: actions/upload-artifact@v4
      with:
        name: pr-info
        path: pr_info.json
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    branches:
    - main
