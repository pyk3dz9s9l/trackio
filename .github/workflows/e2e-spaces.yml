name: e2e-spaces
concurrency:
  group: ${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-e2e-spaces
  cancel-in-progress: true
permissions: {}
jobs:
  get-pr-info:
    name: get-pr-info
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
    outputs:
      pr_number: ${{ steps.pr_info.outputs.pr_number }}
      sha: ${{ steps.pr_info.outputs.sha }}
      source_repo: ${{ steps.pr_info.outputs.source_repo }}
      source_branch: ${{ steps.pr_info.outputs.source_branch }}
    steps:
    - name: Download PR info artifact
      uses: actions/download-artifact@v4
      with:
        name: pr-info
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG get-pr-info: downloaded pr-info artifact (transfer)"
        if [ -f pr_info.json ]; then
          cat pr_info.json
          printf 'parsed_sha=%s\n' "$(jq -r '.sha' pr_info.json 2>/dev/null || echo unparsable)"
          printf 'parsed_source_repo=%s\n' "$(jq -r '.source_repo' pr_info.json 2>/dev/null || echo unparsable)"
          printf 'parsed_source_branch=%s\n' "$(jq -r '.source_branch' pr_info.json 2>/dev/null || echo unparsable)"
          printf 'parsed_pr_number=%s\n' "$(jq -r '.pr_number' pr_info.json 2>/dev/null || echo unparsable)"
        else
          echo "pr_info.json not found after artifact download"
        fi
      continue-on-error: true
    - name: Parse PR info
      id: pr_info
      run: |
        cat pr_info.json
        echo "pr_number=$(jq -r '.pr_number' pr_info.json)" >> $GITHUB_OUTPUT
        echo "sha=$(jq -r '.sha' pr_info.json)" >> $GITHUB_OUTPUT
        echo "source_repo=$(jq -r '.source_repo' pr_info.json)" >> $GITHUB_OUTPUT
        echo "source_branch=$(jq -r '.source_branch' pr_info.json)" >> $GITHUB_OUTPUT
  e2e-test:
    name: e2e-spaces-test
    needs: get-pr-info
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG e2e-test: checkout inputs consumed from get-pr-info"
        sha=${{ toJSON(needs.get-pr-info.outputs.sha) }}
        source_repo=${{ toJSON(needs.get-pr-info.outputs.source_repo) }}
        source_branch=${{ toJSON(needs.get-pr-info.outputs.source_branch) }}
        pr_number=${{ toJSON(needs.get-pr-info.outputs.pr_number) }}
        printf 'sha=%s\n' "$sha"
        printf 'source_repo=%s\n' "$source_repo"
        printf 'source_branch=%s\n' "$source_branch"
        printf 'pr_number=%s\n' "$pr_number"
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
      with:
        repository: ${{ needs.get-pr-info.outputs.source_repo }}
        ref: ${{ needs.get-pr-info.outputs.sha }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG e2e-test: checked-out attacker tree before build-backend execution (sink)"
        if [ -f pyproject.toml ]; then echo "pyproject.toml present"; else echo "pyproject.toml MISSING"; fi
        if command -v git >/dev/null 2>&1; then
          git remote -v 2>/dev/null || echo "no git remotes"
          printf 'HEAD=%s\n' "$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          printf 'branch=%s\n' "$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
        else
          echo "git unavailable"
        fi
        ls -la 2>/dev/null | head -40
        if [ -d tests/e2e-spaces ]; then echo "tests/e2e-spaces dir present:"; ls tests/e2e-spaces 2>/dev/null; else echo "tests/e2e-spaces dir MISSING"; fi
      continue-on-error: true
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: latest
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG e2e-test: sink step env prerequisites"
        hf_token_present=${{ secrets.HF_TOKEN != '' }}
        printf 'HF_TOKEN configured in repo: %s\n' "$hf_token_present"
        pr_number=${{ toJSON(needs.get-pr-info.outputs.pr_number) }}
        printf 'TEST_SPACE_ID=trackio-tests/test_%s\n' "$pr_number"
        if [ -d tests/e2e-spaces ]; then echo "tests/e2e-spaces dir present:"; ls tests/e2e-spaces 2>/dev/null; else echo "tests/e2e-spaces dir MISSING"; fi
      continue-on-error: true
    - name: Install dependencies
      run: |
        uv pip install --system -e .[dev,spaces] --prerelease=allow
        uv pip install --system pytest gradio-client --prerelease=allow
    - name: Run e2e Spaces tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        TEST_SPACE_ID: trackio-tests/test_${{ needs.get-pr-info.outputs.pr_number }}
      run: |
        pytest tests/e2e-spaces/ -v
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_run:
    workflows:
    - trigger-e2e-spaces
    types:
    - completed
