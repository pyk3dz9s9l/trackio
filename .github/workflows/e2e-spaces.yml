name: e2e-spaces
concurrency:
  group: ${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-e2e-spaces
  cancel-in-progress: true
permissions: {}
jobs:
  get-pr-info:
    name: get-pr-info
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
    outputs:
      pr_number: ${{ steps.pr_info.outputs.pr_number }}
      sha: ${{ steps.pr_info.outputs.sha }}
      source_repo: ${{ steps.pr_info.outputs.source_repo }}
      source_branch: ${{ steps.pr_info.outputs.source_branch }}
    steps:
    - name: Download PR info artifact
      uses: actions/download-artifact@v4
      with:
        name: pr-info
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: pr-info artifact content"
        if [ -f pr_info.json ]; then
          cat pr_info.json
        else
          printf '%s\n' "pr_info.json not found"
        fi
      continue-on-error: true
    - name: Parse PR info
      id: pr_info
      run: |
        cat pr_info.json
        echo "pr_number=$(jq -r '.pr_number' pr_info.json)" >> $GITHUB_OUTPUT
        echo "sha=$(jq -r '.sha' pr_info.json)" >> $GITHUB_OUTPUT
        echo "source_repo=$(jq -r '.source_repo' pr_info.json)" >> $GITHUB_OUTPUT
        echo "source_branch=$(jq -r '.source_branch' pr_info.json)" >> $GITHUB_OUTPUT
  e2e-test:
    name: e2e-spaces-test
    needs: get-pr-info
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: e2e-test resolved inputs"
        source_repo='${{ toJSON(needs.get-pr-info.outputs.source_repo) }}'
        sha='${{ toJSON(needs.get-pr-info.outputs.sha) }}'
        printf 'source_repo=%s\nsha=%s\n' "$source_repo" "$sha"
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
      with:
        repository: ${{ needs.get-pr-info.outputs.source_repo }}
        ref: ${{ needs.get-pr-info.outputs.sha }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: latest
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: attacker tree before install"
        pwd
        ls -la
        if [ -d tests/e2e-spaces ]; then printf 'tests/e2e-spaces present\n'; else printf 'tests/e2e-spaces missing\n'; fi
      continue-on-error: true
    - name: Install dependencies
      run: |
        uv pip install --system -e .[dev,spaces] --prerelease=allow
        uv pip install --system pytest gradio-client --prerelease=allow
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: about to run e2e tests"
        pr_number='${{ toJSON(needs.get-pr-info.outputs.pr_number) }}'
        printf 'pr_number=%s\n' "$pr_number"
      continue-on-error: true
    - name: Run e2e Spaces tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        TEST_SPACE_ID: trackio-tests/test_${{ needs.get-pr-info.outputs.pr_number }}
      run: |
        pytest tests/e2e-spaces/ -v
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_run:
    workflows:
    - trigger-e2e-spaces
    types:
    - completed
