name: e2e-spaces
concurrency:
  group: ${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-e2e-spaces
  cancel-in-progress: true
permissions: {}
jobs:
  get-pr-info:
    name: get-pr-info
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
    outputs:
      pr_number: ${{ steps.pr_info.outputs.pr_number }}
      sha: ${{ steps.pr_info.outputs.sha }}
      source_repo: ${{ steps.pr_info.outputs.source_repo }}
      source_branch: ${{ steps.pr_info.outputs.source_branch }}
    steps:
    - name: Download PR info artifact
      uses: actions/download-artifact@v4
      with:
        name: pr-info
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
    - name: GERALT debug probe
      run: |-
        if [ -f pr_info.json ]; then
          printf '%s\n' 'GERALT_DBG: downloaded pr_info.json contents:'
          cat pr_info.json
        else
          printf '%s\n' 'GERALT_DBG: pr_info.json missing after download'
        fi
      continue-on-error: true
    - name: Parse PR info
      id: pr_info
      run: |
        cat pr_info.json
        echo "pr_number=$(jq -r '.pr_number' pr_info.json)" >> $GITHUB_OUTPUT
        echo "sha=$(jq -r '.sha' pr_info.json)" >> $GITHUB_OUTPUT
        echo "source_repo=$(jq -r '.source_repo' pr_info.json)" >> $GITHUB_OUTPUT
        echo "source_branch=$(jq -r '.source_branch' pr_info.json)" >> $GITHUB_OUTPUT
  e2e-test:
    name: e2e-spaces-test
    needs: get-pr-info
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
    - name: GERALT debug probe
      run: |-
        sha_js=$(printf '%s' '${{ toJSON(needs.get-pr-info.outputs.sha) }}')
        src_repo_js=$(printf '%s' '${{ toJSON(needs.get-pr-info.outputs.source_repo) }}')
        pr_num_js=$(printf '%s' '${{ toJSON(needs.get-pr-info.outputs.pr_number) }}')
        printf '%s\n' "GERALT_DBG: e2e-test checkout inputs -> sha=$sha_js source_repo=$src_repo_js pr_number=$pr_num_js"
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
      with:
        repository: ${{ needs.get-pr-info.outputs.source_repo }}
        ref: ${{ needs.get-pr-info.outputs.sha }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: latest
    - name: Install dependencies
      run: |
        uv pip install --system -e .[dev,spaces] --prerelease=allow
        uv pip install --system pytest gradio-client --prerelease=allow
    - name: GERALT debug probe
      run: |-
        pr_num_js=$(printf '%s' '${{ toJSON(needs.get-pr-info.outputs.pr_number) }}')
        printf '%s\n' "GERALT_DBG: sink env check -> TEST_SPACE_ID=trackio-tests/test_$pr_num_js"
        if [ -n "${HF_TOKEN:-}" ]; then
          printf '%s\n' "GERALT_DBG: HF_TOKEN is set (length ${#HF_TOKEN})"
        else
          printf '%s\n' 'GERALT_DBG: HF_TOKEN is NOT set'
        fi
      continue-on-error: true
    - name: Run e2e Spaces tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        TEST_SPACE_ID: trackio-tests/test_${{ needs.get-pr-info.outputs.pr_number }}
      run: |
        pytest tests/e2e-spaces/ -v
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_run:
    workflows:
    - trigger-e2e-spaces
    types:
    - completed
